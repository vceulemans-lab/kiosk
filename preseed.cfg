#_preseed_V1
### Debian 13 - geautomatiseerde installatie van een kiosk-pc
### TEST EERST IN VIRTUALBOX. LET OP: wist de hele schijf zonder te vragen.

### Taal, land, toetsenbord (Belgie)
d-i debian-installer/locale string nl_BE.UTF-8
d-i debian-installer/language string nl
d-i debian-installer/country string BE
d-i keyboard-configuration/xkb-keymap select be

### Netwerk
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string kiosk
d-i netcfg/get_domain string local
d-i hw-detect/load_firmware boolean true

### Pakketbron (internet, niet de installatie-usb)
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/non-free-firmware boolean true

### Accounts
# Tijdelijk root-wachtwoord: wordt vergrendeld zodra het kiosk-script klaar is.
# De beheerder maak je straks zelf aan in het kiosk-script (met sudo-rechten).
d-i passwd/root-login boolean true
d-i passwd/root-password password tijdelijk
d-i passwd/root-password-again password tijdelijk
d-i passwd/make-user boolean false

### Klok
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Brussels
d-i clock-setup/ntp boolean true

### Schijf: gebruikt de eerste gevonden schijf en wist ALLES erop.
# Heb je meer schijven? Kies dan hier de juiste (controleer dit goed!):
#d-i partman-auto/disk string /dev/sda
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### Software: alleen "standaard systeemhulpmiddelen" (geen bureaublad)
tasksel tasksel/first multiselect standard
d-i pkgsel/include string wget ca-certificates
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false

### Opstartbeheer
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

### Kiosk-script ophalen en bij de eerste start laten uitvoeren
# VUL HIER HET ADRES IN waar je kiosk-setup2.sh online hebt gezet:
d-i preseed/late_command string \
  in-target wget -q -O /root/kiosk-setup2.sh https://VUL-HIER-HET-ADRES-VAN-HET-SCRIPT-IN ; \
  in-target bash /root/kiosk-setup2.sh --eerste-start

d-i finish-install/reboot_in_progress note
